name: Release

# A tag v* publishes static Linux binaries and their checksums, which the
# Proxmox installer (install/cmediastack-install.sh) fetches and verifies.
# The tests gate it: a tag whose tests fail publishes nothing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=30m ./...

  build:
    name: Build ${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Build
        # The Dockerfile's flags: static (ADR-0002), no local paths, the
        # commit recorded, the version the tag names.
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -buildvcs=true \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o "cmediastack-linux-${GOARCH}" ./cmd/cmediastack
      - uses: actions/upload-artifact@v4
        with:
          name: cmediastack-linux-${{ matrix.goarch }}
          path: cmediastack-linux-${{ matrix.goarch }}

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum cmediastack-linux-* > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cmediastack-linux-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --generate-notes
